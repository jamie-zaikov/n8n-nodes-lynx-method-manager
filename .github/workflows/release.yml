name: Release

# Publishes the package to the public npm registry with build provenance
# (required for n8n verified community nodes). Triggered by pushing a version
# tag (e.g. `v0.1.0`) or by a published GitHub Release.
#
# One-time setup before the first release:
#   1. Create an npm account and an *automation* access token with publish
#      rights for the `n8n-nodes-lynx-method-manager` package.
#   2. Add it to this repo as an Actions secret named `NPM_TOKEN`.
#      (Alternatively configure npm Trusted Publishing (OIDC) and drop the
#       token — the `id-token: write` permission below already supports it.)
on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (clean, from lockfile, no native builds)
        run: npm ci --ignore-scripts

      # Gate the release on the same quality checks as CI before anything is
      # published. `prepublishOnly` (build + lint + test) also runs on publish.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Publish (public, with provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
