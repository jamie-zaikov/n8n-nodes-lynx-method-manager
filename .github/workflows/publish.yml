name: Publish

# Publishes the package to the public npm registry with build provenance.
# n8n requires verified community nodes to be published from GitHub Actions with
# provenance (local `npm publish` is not accepted for verification).
#
# Auth uses npm Trusted Publishing (OIDC) — no stored token. One-time setup:
#   1. Create an npm account and publish an initial 0.x version (or reserve the
#      name), OR let the first Trusted-Publisher run create it.
#   2. On npmjs.com → the package's Settings → "Publish access" →
#      "Trusted Publishers" → Add → GitHub Actions, with:
#        owner:    jamie-zaikov
#        repo:     n8n-nodes-lynx-method-manager
#        workflow: publish.yml
#   3. Push a version tag to trigger a release, e.g.:
#        git tag v0.1.0 && git push origin v0.1.0
#
# (Token fallback: if you prefer an npm automation token over OIDC, add it as
#  the `NPM_TOKEN` Actions secret and set NODE_AUTH_TOKEN on the publish step.)
on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for provenance + Trusted Publishing (OIDC)

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) and the provenance flag require a recent npm.
      - name: Upgrade npm (Trusted Publishing + provenance support)
        run: npm install -g npm@latest

      - name: Install (clean, from lockfile, no native builds)
        run: npm ci --ignore-scripts

      # Same gates as CI, before anything is published. `prepublishOnly`
      # (build + lint + test) also runs on publish as a backstop.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Publish (public, with provenance)
        run: npm publish --provenance --access public
